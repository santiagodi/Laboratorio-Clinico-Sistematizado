<section class="hero" id="inicio">
  <div class="hero-imagen">
    <img *ngFor="let imagen of imagenes; let i = index"
      [src]="imagen"
      [class.visible]="i === imagenActual"
      alt="Laboratorio Clínico Sistematizado">
    <div class="hero-degradado"></div>
  </div>

  <div class="hero-texto">
    <h1>
      Cuidamos tu salud
      <span class="destacado">con precisión y confianza</span>
    </h1>

    <p>
      En Laboratorio Clínico Sistematizado trabajamos con tecnología
      avanzada y un equipo profesional comprometido con tu bienestar.
    </p>

    <div class="hero-botones">
      <a href="#servicios" class="btn-primario">Nuestros servicios</a>
      <button class="btn-secundario" (click)="abrirWhatsapp()">Contáctanos</button>
    </div>

    <div class="hero-info">
      <p>Más de 30 años cuidando la salud de nuestra comunidad.</p>
    </div>
  </div>

  <div class="hero-puntos">
    <button *ngFor="let imagen of imagenes; let i = index"
      class="punto"
      [class.activo]="i === imagenActual"
      (click)="irAImagen(i)"
      [attr.aria-label]="'Ver imagen ' + (i + 1)">
    </button>
  </div>
</section>
